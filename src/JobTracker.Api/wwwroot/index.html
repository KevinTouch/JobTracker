<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobTracker</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { --ink:#17212b; --muted:#687787; --line:#dfe6ec; --paper:#fff; --wash:#f5f8fa; --accent:#2563eb; --danger:#c24141; --shadow:0 10px 30px #1c2c3d12; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--wash); font:15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    header { background:#17212b; color:#fff; padding:34px max(24px, calc((100% - 1180px)/2)); }
    .header-inner { max-width:1180px; margin:auto; display:flex; justify-content:space-between; gap:24px; align-items:end; }
    .header-action { color:#17212b; background:#fff; }
    header .eyebrow { color:#9fc1ff; font-size:12px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; }
    header h1 { margin:4px 0 2px; font-size:30px; letter-spacing:-.03em; }
    header p { margin:0; color:#bac6d1; }
    main { max-width:1180px; margin:28px auto; padding:0 24px 48px; }
    .layout { display:block; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:22px; }
    h2 { margin:0 0 18px; font-size:18px; letter-spacing:-.02em; }
    label { display:block; margin:14px 0 6px; color:#465463; font-size:13px; font-weight:650; }
    input, select, textarea { width:100%; border:1px solid #cbd6df; border-radius:8px; padding:10px 11px; color:var(--ink); background:#fff; font:inherit; }
    input:focus, select:focus, textarea:focus { outline:3px solid #2563eb22; border-color:var(--accent); }
    textarea { min-height:86px; resize:vertical; }
    .actions { display:flex; gap:9px; margin-top:18px; }
    button { border:0; border-radius:8px; cursor:pointer; padding:10px 14px; font:650 14px inherit; }
    .primary { flex:1; color:#fff; background:var(--accent); }
    .secondary { color:#425466; background:#edf2f6; }
    .danger { border:1px solid #d8e0e7; color:#35516d; background:#fff; padding:6px 11px; font-size:13px; }
    .danger:hover { background:#f1f5f8; }
    .delete { border-color:#f0caca; color:var(--danger); }
    .delete:hover { background:#fff1f1; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar input { flex:1 1 190px; }
    .toolbar select { flex:0 1 160px; }
    .summary { display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; color:var(--muted); font-size:13px; }
    .cards { display:grid; gap:12px; }
    .cards.board { grid-template-columns:repeat(3, minmax(0, 1fr)); align-items:start; }
    .board .card { min-width:0; }
    .card { border:1px solid var(--line); border-radius:11px; padding:16px; background:#fff; }
    .card-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .company { color:var(--muted); font-size:13px; }
    .title { margin:2px 0 4px; font-size:17px; font-weight:750; }
    .date { color:var(--muted); font-size:13px; }
    .badge { white-space:nowrap; border-radius:99px; padding:4px 9px; background:#e8f0ff; color:#2054ae; font-size:12px; font-weight:700; }
    .badge[data-status="Interview"] { background:#fff3db; color:#9a5c00; } .badge[data-status="Offer"] { background:#e0f7eb; color:#087443; } .badge[data-status="Rejected"], .badge[data-status="Withdrawn"] { background:#fbe7e7; color:#a13737; }
    .notes { margin:12px 0 0; color:#465463; white-space:pre-wrap; }
    .card-bottom { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:12px; padding-top:10px; border-top:1px solid #eef2f5; }
    .card-actions { display:flex; gap:8px; flex-shrink:0; }
    .card-bottom a { color:var(--accent); font-size:13px; font-weight:650; }
    .empty { padding:42px 20px; color:var(--muted); text-align:center; border:1px dashed #cbd6df; border-radius:11px; }
    .error { display:none; margin-bottom:16px; padding:11px 13px; border-radius:8px; background:#fbe7e7; color:#943737; }
    .kpis { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px; }
    .kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
    .kpi-label { color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .kpi-value { margin-top:3px; font-size:27px; font-weight:800; letter-spacing:-.04em; }
    .kpi-accent { color:var(--accent); }
    .toolbar { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; }
    dialog { width:min(560px, calc(100% - 32px)); border:0; border-radius:14px; padding:0; box-shadow:0 25px 80px #0b172499; }
    dialog::backdrop { background:#17212b99; }
    .dialog-panel { padding:24px; }
    .dialog-heading { display:flex; justify-content:space-between; align-items:center; }
    .close { background:transparent; color:var(--muted); font-size:22px; padding:0 4px; }
    @media (max-width:1000px) { .kpis { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:800px) { .kpis { grid-template-columns:repeat(2,1fr); } .cards.board { grid-template-columns:1fr; } header { padding:28px 24px; } main { margin-top:18px; } }
    @media (max-width:500px) { .header-inner { align-items:start; flex-direction:column; } .header-action { width:100%; } .kpis { gap:8px; } .kpi { padding:13px; } }
  </style>
</head>
<body>
  <header><div class="header-inner"><div><div class="eyebrow">Personal job search</div><h1>JobTracker</h1><p>Keep every application, interview, and follow-up in one place.</p></div><button id="add-button" class="header-action">+ Add application</button></div></header>
  <main>
    <div id="error" class="error" role="alert"></div>
    <div class="kpis"><div class="kpi"><div class="kpi-label">Total applications</div><div id="total-count" class="kpi-value">—</div></div><div class="kpi"><div class="kpi-label">Active</div><div id="active-count" class="kpi-value kpi-accent">—</div></div><div class="kpi"><div class="kpi-label">Interviews</div><div id="interview-count" class="kpi-value">—</div></div><div class="kpi"><div class="kpi-label">Offers</div><div id="offer-count" class="kpi-value">—</div></div><div class="kpi"><div class="kpi-label">Follow-ups due</div><div id="due-count" class="kpi-value">—</div></div></div>
    <div class="layout">
      <section>
        <div class="toolbar"><input id="company-filter" placeholder="Search by company..."><select id="status-filter"><option value="">All statuses</option><option>Wishlist</option><option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option><option>Withdrawn</option></select><select id="follow-up-filter"><option value="">All follow-ups</option><option value="due">Due today or overdue</option><option value="overdue">Overdue only</option></select><select id="sort-filter"><option value="date">Newest first</option><option value="company">Company A–Z</option><option value="status">Status</option><option value="followup">Follow-up date</option><option value="date-oldest">Oldest first</option></select><button id="list-view" class="secondary" type="button">List</button><button id="board-view" class="secondary" type="button">Board</button></div>
        <div class="summary"><span id="count">Loading applications...</span><a href="/swagger" target="_blank">API docs ↗</a></div>
        <div id="cards" class="cards"></div>
      </section>
    </div>
    <dialog id="application-dialog">
      <div class="dialog-panel">
        <div class="dialog-heading"><h2 id="form-title">Add an application</h2><button id="close-dialog" class="close" type="button" aria-label="Close">×</button></div>
        <form id="application-form">
          <input id="application-id" type="hidden">
          <label for="company">Company</label><input id="company" required maxlength="200" placeholder="Acme Corp">
          <label for="job-title">Job title</label><input id="job-title" required maxlength="200" placeholder="Backend Engineer">
          <label for="status">Status</label><select id="status"><option>Wishlist</option><option selected>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option><option>Withdrawn</option></select>
          <label for="application-date">Application date</label><input id="application-date" type="date" required>
          <label for="job-url">Job URL <span style="font-weight:400;color:#8895a2">(optional)</span></label><input id="job-url" type="url" maxlength="2048" placeholder="https://..."><label for="location">Location</label><input id="location" maxlength="200" placeholder="Irvine, CA or Remote"><label for="work-arrangement">Work arrangement</label><select id="work-arrangement"><option value="">Not specified</option><option>Remote</option><option>Hybrid</option><option>On-site</option></select><label for="salary-range">Salary range</label><input id="salary-range" maxlength="100" placeholder="$120k–$150k"><label for="contact-name">Recruiter or contact</label><input id="contact-name" maxlength="200" placeholder="Alex Johnson"><label for="interview-date">Interview date <span style="font-weight:400;color:#8895a2">(optional)</span></label><input id="interview-date" type="date"><label for="next-action-date">Next follow-up date <span style="font-weight:400;color:#8895a2">(optional)</span></label><input id="next-action-date" type="date"><label for="notes">Notes</label><textarea id="notes" maxlength="5000" placeholder="Referral, next steps, salary details..."></textarea>
          <div class="actions"><button class="primary" type="submit">Save application</button><button id="cancel" class="secondary" type="button" hidden>Cancel</button></div>
        </form>
      </div>
    </dialog>
  </main>
  <script>
    const api = '/api/JobApplications';
    const $ = id => document.getElementById(id);
    let applications = [], viewMode = 'list';
    const showError = message => { $('error').textContent = message; $('error').style.display = message ? 'block' : 'none'; };
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    async function load() {
      try { const response = await fetch(api); if (!response.ok) throw new Error('Could not load applications.'); applications = await response.json(); render(); }
      catch (error) { showError(error.message); }
    }
    function render() {
      const company = $('company-filter').value.toLowerCase(); const status = $('status-filter').value; const followUp = $('follow-up-filter').value;
      let visible = applications.filter(x => (!status || x.status === status) && (!company || x.company.toLowerCase().includes(company)));
      const today = new Date().toISOString().slice(0,10); const active = x => !['Rejected', 'Withdrawn', 'Offer'].includes(x.status);
      if (followUp === 'due') visible = visible.filter(x => x.nextActionDate && x.nextActionDate <= today && active(x));
      if (followUp === 'overdue') visible = visible.filter(x => x.nextActionDate && x.nextActionDate < today && active(x));
      const sort = $('sort-filter').value;
      visible.sort((a,b) => sort === 'company' ? a.company.localeCompare(b.company) : sort === 'status' ? a.status.localeCompare(b.status) : sort === 'followup' ? (a.nextActionDate || '9999').localeCompare(b.nextActionDate || '9999') : sort === 'date-oldest' ? a.applicationDate.localeCompare(b.applicationDate) : b.applicationDate.localeCompare(a.applicationDate));
      $('total-count').textContent = applications.length;
      $('active-count').textContent = applications.filter(x => !['Rejected', 'Withdrawn'].includes(x.status)).length;
      $('interview-count').textContent = applications.filter(x => x.status === 'Interview').length;
      $('offer-count').textContent = applications.filter(x => x.status === 'Offer').length;
      const today = new Date().toISOString().slice(0,10);
      $('due-count').textContent = applications.filter(x => x.nextActionDate && x.nextActionDate <= today && !['Rejected', 'Withdrawn', 'Offer'].includes(x.status)).length;
      $('count').textContent = `${visible.length} application${visible.length === 1 ? '' : 's'}`;
      $('cards').className = viewMode === 'board' ? 'cards board' : 'cards'; $('list-view').classList.toggle('primary', viewMode === 'list'); $('board-view').classList.toggle('primary', viewMode === 'board');
      $('cards').innerHTML = visible.length ? visible.map(x => { const due = x.nextActionDate && x.nextActionDate <= today && active(x); return `<article class="card"><div class="card-top"><div><div class="company">${escapeHtml(x.company)}</div><div class="title">${escapeHtml(x.jobTitle)}</div><div class="date">Applied ${escapeHtml(x.applicationDate)}${x.location ? ` · ${escapeHtml(x.location)}` : ''}</div></div><span class="badge" data-status="${escapeHtml(x.status)}">${escapeHtml(x.status)}</span></div>${x.workArrangement || x.salaryRange || x.contactName ? `<div class="notes">${[x.workArrangement, x.salaryRange, x.contactName ? `Contact: ${x.contactName}` : ''].filter(Boolean).map(escapeHtml).join(' · ')}</div>` : ''}${x.interviewDate ? `<div class="date">Interview: ${escapeHtml(x.interviewDate)}</div>` : ''}${x.nextActionDate ? `<div class="date" style="color:${due ? 'var(--danger)' : 'var(--muted)'};font-weight:${due ? '700' : '400'}">${due ? 'Follow-up due' : 'Follow up'}: ${escapeHtml(x.nextActionDate)}</div>` : ''}${x.notes ? `<div class="notes">${escapeHtml(x.notes)}</div>` : ''}<div class="card-bottom">${x.jobUrl ? `<a href="${escapeHtml(x.jobUrl)}" target="_blank" rel="noreferrer">View job posting ↗</a>` : '<span></span>'}<div class="card-actions"><button class="danger edit" data-id="${x.id}">Edit</button><button class="danger delete" data-id="${x.id}">Delete</button></div></div></article>`; }).join('') : '<div class="empty">No applications match your filters.<br>Add your first application using the form.</div>';
      document.querySelectorAll('.edit').forEach(button => button.onclick = () => edit(Number(button.dataset.id)));
      document.querySelectorAll('.delete').forEach(button => button.onclick = () => remove(Number(button.dataset.id)));
    }
    function resetForm() { $('application-form').reset(); $('application-id').value = ''; $('application-date').value = new Date().toISOString().slice(0,10); $('form-title').textContent = 'Add an application'; $('cancel').hidden = true; document.querySelector('.primary').textContent = 'Save application'; }
    function edit(id) { const x = applications.find(item => item.id === id); if (!x) return; $('application-id').value=x.id; $('company').value=x.company; $('job-title').value=x.jobTitle; $('status').value=x.status; $('application-date').value=x.applicationDate; $('job-url').value=x.jobUrl || ''; $('location').value=x.location || ''; $('work-arrangement').value=x.workArrangement || ''; $('salary-range').value=x.salaryRange || ''; $('contact-name').value=x.contactName || ''; $('interview-date').value=x.interviewDate || ''; $('next-action-date').value=x.nextActionDate || ''; $('notes').value=x.notes || ''; $('form-title').textContent='Edit application'; $('cancel').hidden=false; document.querySelector('.primary').textContent='Update application'; $('application-dialog').showModal(); }
    async function remove(id) { if (!confirm('Delete this application?')) return; const response = await fetch(`${api}/${id}`, {method:'DELETE'}); if (!response.ok) return showError('Could not delete application.'); applications = applications.filter(x => x.id !== id); render(); }
    $('application-form').onsubmit = async event => { event.preventDefault(); showError(''); const id = $('application-id').value; const payload = {company:$('company').value, jobTitle:$('job-title').value, status:$('status').value, applicationDate:$('application-date').value, jobUrl:$('job-url').value || null, location:$('location').value || null, workArrangement:$('work-arrangement').value || null, salaryRange:$('salary-range').value || null, contactName:$('contact-name').value || null, interviewDate:$('interview-date').value || null, nextActionDate:$('next-action-date').value || null, notes:$('notes').value || null}; const response = await fetch(id ? `${api}/${id}` : api, {method:id ? 'PUT':'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)}); if (!response.ok) { const problem=await response.json().catch(()=>null); return showError(problem?.detail || 'Please check the form and try again.'); } $('application-dialog').close(); resetForm(); await load(); };
    $('add-button').onclick = () => { resetForm(); $('application-dialog').showModal(); }; $('close-dialog').onclick = () => { $('application-dialog').close(); resetForm(); }; $('cancel').onclick = () => { $('application-dialog').close(); resetForm(); }; $('company-filter').oninput = render; $('status-filter').onchange = render; $('follow-up-filter').onchange = render; $('sort-filter').onchange = render; $('list-view').onclick = () => { viewMode = 'list'; render(); }; $('board-view').onclick = () => { viewMode = 'board'; render(); }; resetForm(); load();
  </script>
</body>
</html>
